<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FFF4DE">
    <meta name="description" content="Game quản lý quầy bánh tráng trộn Việt Nam, chuẩn bị nguyên liệu, trộn món và phục vụ khách mỗi ngày.">
    <title>Tiệm Bánh Tráng Trộn</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./img/banh-trang.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/preparation.css">
    <link rel="stylesheet" href="./css/selling.css">
    <link rel="stylesheet" href="./css/game.css">
    <link rel="stylesheet" href="./css/splash.css">
  </head>
  <body>
    <div class="app-shell" id="app-shell" aria-hidden="true">
      <header id="header" class="app-header"></header>
      <div class="awning" aria-hidden="true"></div>
      <main id="view" class="main-view" tabindex="-1"></main>
    </div>
    <div id="splash" class="splash-layer" hidden></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="modal" class="modal-layer" aria-hidden="true">
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" type="button" data-action="close-modal" aria-label="Đóng">×</button>
        <div id="modal-content"></div>
      </section>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
