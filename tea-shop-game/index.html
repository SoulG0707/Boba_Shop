<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4a080">
    <meta name="description" content="Game quản lý tiệm trà sữa nhỏ — pha trà, đón khách và phát triển cửa tiệm.">
    <title>Trà Nhỏ — Quản lý tiệm trà</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./img/tea-cup.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/game.css">
  </head>
  <body>
    <div class="app-shell">
      <header id="header" class="app-header"></header>
      <div class="app-body">
        <nav id="navigation" class="main-navigation" aria-label="Điều hướng chính"></nav>
        <main id="view" class="main-view" tabindex="-1"></main>
      </div>
    </div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="modal" class="modal-layer" aria-hidden="true">
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" type="button" data-action="close-modal" aria-label="Đóng">×</button>
        <div id="modal-content"></div>
      </section>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
