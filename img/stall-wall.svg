<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" fill="none">
  <defs>
    <linearGradient id="wall" x1="800" y1="0" x2="800" y2="1100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4dc"/>
      <stop offset=".58" stop-color="#ffeac4"/>
      <stop offset="1" stop-color="#f5d29e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bd7a41"/>
      <stop offset=".48" stop-color="#8a4e2b"/>
      <stop offset="1" stop-color="#6d3d26"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5ca62" stop-opacity=".65"/>
      <stop offset="1" stop-color="#e98c3a" stop-opacity=".25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="wallgrain" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="9" r="1.2" fill="#c37a40" fill-opacity=".12"/>
